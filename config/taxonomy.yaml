# 3D Printing Research Taxonomy & Discovery Config
#
# Focus: additive manufacturing research — FDM/FFF and resin processes,
# materials, slicing/toolpath algorithms, part quality, printer firmware,
# print farms, and generative design for fabrication
#
# Pipeline: config/taxonomy.yaml -> papers.yaml -> validate -> README -> reports
# please edit below for your topic -------------------------------------------

# --- Topic -----------------------------------------------------------
topic:
  name: "3D Printing Research"
  short: "3dp"
  description: "Additive manufacturing and 3D printing: FDM/FFF and resin processes, materials, slicer algorithms, part quality, printer firmware, and generative design."
  openalex_mailto: "tobias@tobias-weiss.org"

# --- Taxonomy ----------------------------------------------------------
# Categories = the main axis of your review
# Subcategories = the secondary axis
# Each paper must carry one category + one subcategory.
taxonomy:
  categories:
    - id: processes
      display: "Processes"
      description: "FDM/FFF, SLA/DLP resin, and process parameter studies"

    - id: materials
      display: "Materials & Filaments"
      description: "Filament formulations, composites, and polymer science"

    - id: slicing
      display: "Slicing & Toolpath"
      description: "Slicer algorithms, infill, supports, toolpath planning"

    - id: part-quality
      display: "Part Quality & Strength"
      description: "Layer adhesion, strength, tolerances, and defect analysis"

    - id: printers
      display: "Printers & Firmware"
      description: "Printer kinematics, calibration, Klipper/Rinkhals and open firmware"

    - id: print-farm
      display: "Print Farms & Automation"
      description: "Fleet management, monitoring, quality control and automation"

    - id: generative-design
      display: "Generative Design"
      description: "Topology optimization, lattice design and design-for-additive"

    - id: applications
      display: "Applications"
      description: "Domain applications: medical, aerospace, education, maker culture"

    - id: surveys
      display: "Surveys"
      description: "Systematic reviews of additive manufacturing research"

  subcategories:
    # Processes
    - id: fdm-process
      category: processes
      display: "FDM/FFF Process"
      description: "Fused deposition modeling and filament extrusion parameters"

    - id: sla-dlp
      category: processes
      display: "SLA & DLP"
      description: "Resin vat photopolymerization processes and curing"

    - id: post-processing
      category: processes
      display: "Post-Processing"
      description: "Annealing, surface finishing and post-print treatments"

    # Materials
    - id: polymer-materials
      category: materials
      display: "Polymers & Filaments"
      description: "PLA/ABS/PETG and specialty filament materials"

    - id: composites
      category: materials
      display: "Composites & Filled"
      description: "Carbon-fiber filled and reinforced materials"

    - id: resin-materials
      category: materials
      display: "Resin Chemistries"
      description: "Photopolymer resins and mechanical behavior"

    # Slicing & Toolpath
    - id: infill
      category: slicing
      display: "Infill Patterns"
      description: "Infill geometry, density and mechanical effect"

    - id: supports
      category: slicing
      display: "Support Structures"
      description: "Support generation, removal and tree supports"

    - id: toolpath
      category: slicing
      display: "Toolpath Optimization"
      description: "Path planning, adaptive slicing and seam handling"

    # Part Quality
    - id: strength
      category: part-quality
      display: "Strength & Adhesion"
      description: "Layer adhesion, tensile strength and anisotropy"

    - id: tolerances
      category: part-quality
      display: "Tolerances & Accuracy"
      description: "Dimensional accuracy, shrinkage and repeatability"

    - id: defects
      category: part-quality
      display: "Defects & Detection"
      description: "Print defects, failure modes and in-situ monitoring"

    # Printers & Firmware
    - id: calibration
      category: printers
      display: "Calibration"
      description: "Z-offset, flow, input shaping and auto-calibration"

    - id: kinematics
      category: printers
      display: "Kinematics & Motion"
      description: "Motion systems, resonance and input shaping"

    - id: firmware
      category: printers
      display: "Firmware & Control"
      description: "Klipper, Rinkhals, Marlin and open control stacks"

    # Print Farms
    - id: fleet-management
      category: print-farm
      display: "Fleet Management"
      description: "Farm orchestration, job scheduling and fleet monitoring"

    - id: quality-control
      category: print-farm
      display: "Quality Control"
      description: "Automated QC, vision inspection and traceability"

    # Generative Design
    - id: topology-optimization
      category: generative-design
      display: "Topology Optimization"
      description: "Topology and shape optimization for fabrication"

    - id: lattice-design
      category: generative-design
      display: "Lattice & Cellular"
      description: "Lattice structures and cellular materials"

    - id: dfam
      category: generative-design
      display: "Design for AM"
      description: "Design-for-additive-manufacturing principles and tools"

    # Applications
    - id: medical-application
      category: applications
      display: "Medical & Dental"
      description: "Biomedical printing, surgical guides and prosthetics"

    - id: maker-application
      category: applications
      display: "Maker & Education"
      description: "Desktop printing, maker culture and education"

    # Surveys
    - id: survey
      category: surveys
      display: "Surveys"
      description: "Systematic reviews of additive manufacturing"

# --- Discovery: arXiv queries (fetch_new_papers.py) -------------------------------
# Each entry is an arXiv API query string (cat: + abs:/ti: operators).
arxiv_queries:
  - query: 'cat:cs.RO AND (abs:"3D printing" OR abs:"additive manufacturing" OR abs:"fused deposition")'
    category: fdm-process

  - query: 'cat:cs.LG AND (abs:"additive manufacturing" AND abs:"machine learning")'
    category: defects

  - query: 'cat:cs.GR AND (abs:"toolpath" OR abs:"slicing" OR abs:"3D printing")'
    category: toolpath

  - query: 'cat:cs.GR AND abs:"infill"'
    category: infill

  - query: 'cat:cs.RO AND abs:"3D printer"'
    category: calibration

  - query: 'cat:cs.CG AND (abs:"topology optimization" OR abs:"generative design")'
    category: topology-optimization

  - query: 'cat:cond-mat.mtrl-sci AND (abs:"additive manufacturing" OR abs:"FDM")'
    category: polymer-materials

  - query: 'cat:cs.RO AND (abs:"input shaping" OR abs:"resonance compensation")'
    category: kinematics

  - query: 'cat:cs.CY AND (abs:"distributed manufacturing" OR abs:"digital fabrication")'
    category: maker-application

  - query: 'cat:cs.LG AND (abs:"lattice structure" OR abs:"cellular material")'
    category: lattice-design

  - query: 'cat:cs.RO AND (abs:"print defect" OR abs:"layer adhesion" OR abs:"print quality")'
    category: defects

  - query: 'cat:cs.RO AND (abs:"print farm" OR abs:"multi-printer" OR abs:"fleet")'
    category: fleet-management

  - query: 'cat:cs.SY AND (abs:"3D printing" AND (abs:"monitor" OR abs:"sensor" OR abs:"vision"))'
    category: quality-control

  - query: 'cat:cs.RO AND (abs:"SLA" OR abs:"DLP" OR abs:"resin printing")'
    category: sla-dlp

  - query: 'cat:cs.LG AND (abs:"generative design" OR abs:"design for manufacturing")'
    category: dfam

  - query: 'cat:eess.IV AND (abs:"3D printing" AND (abs:"inspection" OR abs:"defect detection"))'
    category: quality-control

  - query: 'cat:cs.RO AND (abs:"carbon fiber" OR abs:"composite" AND abs:"3D printing")'
    category: composites

  - query: 'cat:cs.DB OR cat:cs.DC'
    category: survey

# --- Discovery: OpenAlex bulk queries (fetch_openalex_bulk.py) ---
