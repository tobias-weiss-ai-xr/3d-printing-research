topic:
  name: 3D Printing Research
  short: 3dp
  description: 'Additive manufacturing and 3D printing: FDM/FFF and resin processes, materials, slicer algorithms,
    part quality, printer firmware, and generative design.'
  openalex_mailto: tobias@tobias-weiss.org
taxonomy:
  categories:
  - id: processes
    display: Processes
    description: FDM/FFF, SLA/DLP resin, and process parameter studies
  - id: materials
    display: Materials & Filaments
    description: Filament formulations, composites, and polymer science
  - id: slicing
    display: Slicing & Toolpath
    description: Slicer algorithms, infill, supports, toolpath planning
  - id: part-quality
    display: Part Quality & Strength
    description: Layer adhesion, strength, tolerances, and defect analysis
  - id: printers
    display: Printers & Firmware
    description: Printer kinematics, calibration, Klipper/Rinkhals and open firmware
  - id: print-farm
    display: Print Farms & Automation
    description: Fleet management, monitoring, quality control and automation
  - id: generative-design
    display: Generative Design
    description: Topology optimization, lattice design and design-for-additive
  - id: applications
    display: Applications
    description: 'Domain applications: medical, aerospace, education, maker culture'
  - id: surveys
    display: Surveys
    description: Systematic reviews of additive manufacturing research
  subcategories:
  - id: fdm-process
    category: processes
    display: FDM/FFF Process
    description: Fused deposition modeling and filament extrusion parameters
  - id: sla-dlp
    category: processes
    display: SLA & DLP
    description: Resin vat photopolymerization processes and curing
  - id: post-processing
    category: processes
    display: Post-Processing
    description: Annealing, surface finishing and post-print treatments
  - id: polymer-materials
    category: materials
    display: Polymers & Filaments
    description: PLA/ABS/PETG and specialty filament materials
  - id: composites
    category: materials
    display: Composites & Filled
    description: Carbon-fiber filled and reinforced materials
  - id: resin-materials
    category: materials
    display: Resin Chemistries
    description: Photopolymer resins and mechanical behavior
  - id: infill
    category: slicing
    display: Infill Patterns
    description: Infill geometry, density and mechanical effect
  - id: supports
    category: slicing
    display: Support Structures
    description: Support generation, removal and tree supports
  - id: toolpath
    category: slicing
    display: Toolpath Optimization
    description: Path planning, adaptive slicing and seam handling
  - id: strength
    category: part-quality
    display: Strength & Adhesion
    description: Layer adhesion, tensile strength and anisotropy
  - id: tolerances
    category: part-quality
    display: Tolerances & Accuracy
    description: Dimensional accuracy, shrinkage and repeatability
  - id: defects
    category: part-quality
    display: Defects & Detection
    description: Print defects, failure modes and in-situ monitoring
  - id: calibration
    category: printers
    display: Calibration
    description: Z-offset, flow, input shaping and auto-calibration
  - id: kinematics
    category: printers
    display: Kinematics & Motion
    description: Motion systems, resonance and input shaping
  - id: firmware
    category: printers
    display: Firmware & Control
    description: Klipper, Rinkhals, Marlin and open control stacks
  - id: fleet-management
    category: print-farm
    display: Fleet Management
    description: Farm orchestration, job scheduling and fleet monitoring
  - id: quality-control
    category: print-farm
    display: Quality Control
    description: Automated QC, vision inspection and traceability
  - id: topology-optimization
    category: generative-design
    display: Topology Optimization
    description: Topology and shape optimization for fabrication
  - id: lattice-design
    category: generative-design
    display: Lattice & Cellular
    description: Lattice structures and cellular materials
  - id: dfam
    category: generative-design
    display: Design for AM
    description: Design-for-additive-manufacturing principles and tools
  - id: medical-application
    category: applications
    display: Medical & Dental
    description: Biomedical printing, surgical guides and prosthetics
  - id: maker-application
    category: applications
    display: Maker & Education
    description: Desktop printing, maker culture and education
  - id: survey
    category: surveys
    display: Surveys
    description: Systematic reviews of additive manufacturing
