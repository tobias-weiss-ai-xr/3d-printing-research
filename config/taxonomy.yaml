# --- Multi-source queries (fetch_other_sources.py) ---
other_sources_queries:
  - source: crossref
    query: "fused deposition modeling"
    category: fdm-process
  - source: crossref
    query: "3D printing materials"
    category: polymer-materials
  - source: dblp
    query: "additive manufacturing machine learning"
    category: defects
  - source: crossref
    query: "topology optimization additive manufacturing"
    category: topology-optimization

